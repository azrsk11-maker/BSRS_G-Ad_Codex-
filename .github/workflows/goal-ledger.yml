name: Goal ledger checks
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/goal-ledger.yml'
      - 'tools/goal-ledger/**'
      - 'docs/EXECUTION_BACKLOG_100.md'
permissions:
  contents: read
concurrency:
  group: goal-ledger-${{ github.ref }}
  cancel-in-progress: true
jobs:
  goal-ledger-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate the planning ledger without provider access
        run: |
          python3 -B -m unittest discover -s tools/goal-ledger -p test_ledger.py
          python3 -B tools/goal-ledger/ledger.py validate tools/goal-ledger/goals.json
