name: Foundation validation
on:
  pull_request:
    branches: [main]
# Every implementation branch must have a PR (draft is sufficient).
# PR-only validation avoids running the same jobs for both push and PR events.
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate planning, keyword conflicts, tracking and local builds
        run: python3 -B tools/check_repository.py
  native-wordpress-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Lint native adapter and run isolated WordPress behavior tests
        run: |
          php --version
          php -l tools/native-wordpress/native-draft-preview.php
          php -l tools/native-wordpress/tests/native-draft-preview-test.php
          php -l tools/native-wordpress/native-draft-writer.php
          php -l tools/native-wordpress/tests/native-draft-writer-test.php
          php -l tools/property-decision-tools/property-decision-tools.php
          php -l tools/property-decision-tools/native-wordpress-test.php
          php -l tools/property-decision-tools/php.test.php
          php tools/property-decision-tools/php.test.php
          find tools/owner-mail-review -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tools/owner-mail-review/test_owner_mail_review.php
          php tools/owner-mail-review/guard.test.php
          php tools/native-wordpress/tests/native-draft-preview-test.php
          php tools/consent-retention/linkage.test.php
          php -l tools/consent-retention/compaction-native.php
          php tools/consent-retention/compaction.test.php
          php tools/consent-retention/per-choice/test_per_choice.php
          find tools/consent-retention/per-choice -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tools/consent-retention/per-choice/selective-choice.test.php
          php tools/consent-retention/per-choice/purpose-choice.test.php
          php tools/website-tracking/tracking-system/receipt-recovery.test.php
      # Site Health on 7 November reports production PHP 8.2.35.
      # Keep the runner-runtime check above and explicitly cover its 8.2 minor.
      - name: Select production PHP minor
        uses: shivammathur/setup-php@ec406be512d7077f68eed36e63f4d91bc006edc4 # 2.35.4
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate native adapter on production PHP minor
        run: |
          php --version
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 2 ? 0 : 1);'
          php -l tools/native-wordpress/native-draft-preview.php
          php -l tools/native-wordpress/tests/native-draft-preview-test.php
          php tools/native-wordpress/tests/native-draft-preview-test.php
          php tools/consent-retention/per-choice/test_per_choice.php
          find tools/consent-retention/per-choice -name '*.php' -print0 | xargs -0 -n 1 php -l
          php tools/consent-retention/per-choice/selective-choice.test.php
          php tools/consent-retention/per-choice/purpose-choice.test.php
