name: Commercial and worktree verification
on:
  pull_request:
    branches: [main, 'codex/phase0-audit-foundation']
    paths:
      - '.github/workflows/goal-verification.yml'
      - 'tools/efficiency/**'
      - 'tools/website-tracking/commercial-system/*media_exposure.py'
permissions:
  contents: read
concurrency:
  group: goal-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify commercial exposure boundaries
        run: python3 -B -m unittest discover -s tools/website-tracking/commercial-system -p test_media_exposure.py
      - name: Verify the complete efficiency test group
        run: python3 -B -m unittest discover -s tools/efficiency -p 'test_*.py'
